<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A-Frame Bedroom</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>
  <a-scene shadow="type: pcfsoft">

    <a-assets>
      <img id="wood" src="/textures/wood.jpg" />
      <img id="wall" src="/textures/wall.jpg" />
      <img id="fabric" src="/textures/fabric.jpg" />
      <img id="poster" src="/textures/poster.jpg" />
      <img id="rug" src="/textures/rug.jpg" />
    </a-assets>

    <!-- Lights -->
    <a-light
      type="ambient"
      color="#ffffff"
      intensity="0.35">
    </a-light>

    <a-light
      type="directional"
      color="#ffffff"
      intensity="0.75"
      position="-4 6 3"
      castShadow="true"
      shadowMapWidth="1024"
      shadowMapHeight="1024">
    </a-light>

    <a-light
      type="point"
      color="#ffd6a0"
      intensity="1.4"
      distance="7"
      position="2.8 2.4 -4.8">
    </a-light>

    <!-- Floor -->
    <a-box
      position="0 0 -4"
      width="8"
      height="0.1"
      depth="8"
      src="#wood"
      repeat="4 4"
      shadow="receive: true">
    </a-box>

    <!-- Walls -->
    <a-box
      position="0 2 -8"
      width="8"
      height="4"
      depth="0.1"
      src="#wall"
      repeat="3 2">
    </a-box>

    <a-box
      position="-4 2 -4"
      width="0.1"
      height="4"
      depth="8"
      src="#wall"
      repeat="3 2">
    </a-box>

    <a-box
      position="4 2 -4"
      width="0.1"
      height="4"
      depth="8"
      src="#wall"
      repeat="3 2">
    </a-box>

    <!-- Ceiling -->
    <a-box
      position="0 4 -4"
      width="8"
      height="0.1"
      depth="8"
      color="#eeeeee">
    </a-box>

    <!-- Bed frame -->
    <a-box
      position="-2.1 0.35 -5.5"
      width="2.5"
      height="0.4"
      depth="3.5"
      color="#5a3b2e"
      shadow="cast: true; receive: true">
    </a-box>

    <!-- Mattress -->
    <a-box
      position="-2.1 0.75 -5.5"
      width="2.35"
      height="0.35"
      depth="3.3"
      src="#fabric"
      color="#dddddd"
      shadow="cast: true">
    </a-box>

    <!-- Blanket -->
    <a-box
      position="-2.1 1.02 -4.7"
      width="2.25"
      height="0.12"
      depth="1.8"
      color="#3b5f8a"
      shadow="cast: true">
    </a-box>

    <!-- Pillow -->
    <a-box
      position="-2.1 1.05 -6.85"
      width="1.5"
      height="0.25"
      depth="0.55"
      color="#ffffff"
      shadow="cast: true">
    </a-box>

    <!-- Nightstand -->
    <a-box
      position="-3.45 0.45 -6.4"
      width="0.75"
      height="0.9"
      depth="0.75"
      color="#4a2f24"
      shadow="cast: true">
    </a-box>

    <!-- Lamp -->
    <a-cylinder
      position="-3.45 1.05 -6.4"
      radius="0.14"
      height="0.45"
      color="#222222"
      shadow="cast: true">
    </a-cylinder>

    <a-cone
      position="-3.45 1.45 -6.4"
      radius-bottom="0.35"
      radius-top="0.2"
      height="0.45"
      color="#f3d19c"
      shadow="cast: true">
    </a-cone>

    <!-- Desk top -->
    <a-box
      position="2.1 1 -6.2"
      width="2"
      height="0.15"
      depth="0.9"
      color="#4a2f24"
      shadow="cast: true">
    </a-box>

    <!-- Desk legs -->
    <a-box position="1.25 0.5 -5.85" width="0.15" height="1" depth="0.15" color="#222222"></a-box>
    <a-box position="2.95 0.5 -5.85" width="0.15" height="1" depth="0.15" color="#222222"></a-box>
    <a-box position="1.25 0.5 -6.55" width="0.15" height="1" depth="0.15" color="#222222"></a-box>
    <a-box position="2.95 0.5 -6.55" width="0.15" height="1" depth="0.15" color="#222222"></a-box>

    <!-- Computer monitor -->
    <a-box
      position="2.1 1.45 -6.55"
      width="1.1"
      height="0.65"
      depth="0.08"
      color="#111111"
      shadow="cast: true">
    </a-box>

    <a-box
      position="2.1 1.45 -6.5"
      width="0.95"
      height="0.5"
      depth="0.03"
      color="#3e6f9e">
    </a-box>

    <!-- Keyboard -->
    <a-box
      position="2.1 1.12 -6.05"
      width="1"
      height="0.05"
      depth="0.3"
      color="#111111">
    </a-box>

    <!-- Chair -->
    <a-box
      position="2.1 0.55 -4.9"
      width="0.85"
      height="0.15"
      depth="0.85"
      color="#222222"
      shadow="cast: true">
    </a-box>

    <a-box
      position="2.1 1.05 -5.25"
      width="0.85"
      height="1"
      depth="0.15"
      color="#222222"
      shadow="cast: true">
    </a-box>

    <a-cylinder position="2.1 0.3 -4.9" radius="0.08" height="0.6" color="#222222"></a-cylinder>

    <!-- Dresser -->
    <a-box
      position="3.25 0.85 -3.3"
      width="1.2"
      height="1.5"
      depth="0.75"
      color="#6b4635"
      shadow="cast: true">
    </a-box>

    <a-box position="3.25 1.15 -2.91" width="1" height="0.08" depth="0.04" color="#222222"></a-box>
    <a-box position="3.25 0.8 -2.91" width="1" height="0.08" depth="0.04" color="#222222"></a-box>
    <a-box position="3.25 0.45 -2.91" width="1" height="0.08" depth="0.04" color="#222222"></a-box>

    <!-- Window -->
    <a-box
      position="-3.95 2.3 -3.7"
      width="0.05"
      height="1.5"
      depth="1.8"
      color="#87c9ff">
    </a-box>

    <a-box position="-3.9 2.3 -3.7" width="0.08" height="1.65" depth="0.08" color="#ffffff"></a-box>
    <a-box position="-3.9 2.3 -3.1" width="0.08" height="1.65" depth="0.08" color="#ffffff"></a-box>
    <a-box position="-3.9 2.3 -4.3" width="0.08" height="1.65" depth="0.08" color="#ffffff"></a-box>

    <!-- Poster -->
    <a-plane
      position="0.5 2.3 -7.94"
      width="1.4"
      height="2"
      src="#poster">
    </a-plane>

    <!-- Rug -->
    <a-plane
      position="0 0.06 -3.9"
      rotation="-90 0 0"
      width="3"
      height="2"
      src="#rug"
      color="#8a2f2f"
      shadow="receive: true">
    </a-plane>

    <!-- Door -->
    <a-box
      position="3.95 1.4 -6.2"
      width="0.08"
      height="2.8"
      depth="1.25"
      color="#5c3a28">
    </a-box>

    <a-sphere
      position="3.86 1.35 -5.85"
      radius="0.08"
      color="#d4af37">
    </a-sphere>

    <!-- Sky/background -->
    <a-sky color="#20242b"></a-sky>

    <!-- Player camera -->
    <a-entity position="0 1.6 1.5">
      <a-camera
        wasd-controls
        look-controls>
      </a-camera>
    </a-entity>

  </a-scene>
</body>
</html>
