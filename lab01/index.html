<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>A-Frame Bedroom</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <!-- Inspector -->
  <script src="https://unpkg.com/aframe-inspector@1.7.0/dist/aframe-inspector.min.js"></script>
</head>

<body>

  <a-scene shadow="type: pcfsoft">

    <!-- LIGHTING -->

    <a-light
      type="ambient"
      color="#ffffff"
      intensity="0.4">
    </a-light>

    <a-light
      type="directional"
      color="#ffffff"
      intensity="0.8"
      position="-4 6 3"
      castShadow="true"
      shadowMapWidth="1024"
      shadowMapHeight="1024">
    </a-light>

    <a-light
      type="point"
      color="#ffd6a0"
      intensity="1.5"
      distance="8"
      position="-3 2.5 -6">
    </a-light>

    <!-- FLOOR -->

    <a-box
      position="0 0 -4"
      width="8"
      height="0.1"
      depth="8"
      color="#8b5a2b"
      shadow="receive: true">
    </a-box>

    <!-- BACK WALL -->

    <a-box
      position="0 2 -8"
      width="8"
      height="4"
      depth="0.1"
      color="#d9d9d9">
    </a-box>

    <!-- LEFT WALL -->

    <a-box
      position="-4 2 -4"
      width="0.1"
      height="4"
      depth="8"
      color="#cfcfcf">
    </a-box>

    <!-- RIGHT WALL -->

    <a-box
      position="4 2 -4"
      width="0.1"
      height="4"
      depth="8"
      color="#cfcfcf">
    </a-box>

    <!-- CEILING -->

    <a-box
      position="0 4 -4"
      width="8"
      height="0.1"
      depth="8"
      color="#f2f2f2">
    </a-box>

    <!-- BED FRAME -->

    <a-box
      position="-2 0.3 -5.7"
      width="2.5"
      height="0.4"
      depth="3.5"
      color="#5b3a29"
      shadow="cast: true; receive: true">
    </a-box>

    <!-- MATTRESS -->

    <a-box
      position="-2 0.7 -5.7"
      width="2.35"
      height="0.35"
      depth="3.3"
      color="#e6e6e6"
      shadow="cast: true">
    </a-box>

    <!-- PILLOW -->

    <a-box
      position="-2 1 -7"
      width="1.5"
      height="0.2"
      depth="0.6"
      color="#ffffff"
      shadow="cast: true">
    </a-box>

    <!-- BLANKET -->

    <a-box
      position="-2 0.95 -4.9"
      width="2.2"
      height="0.12"
      depth="1.8"
      color="#355c8a"
      shadow="cast: true">
    </a-box>

    <!-- NIGHTSTAND -->

    <a-box
      position="-3.4 0.45 -6.5"
      width="0.8"
      height="0.9"
      depth="0.8"
      color="#4a2d20"
      shadow="cast: true">
    </a-box>

    <!-- LAMP -->

    <a-cylinder
      position="-3.4 1.05 -6.5"
      radius="0.07"
      height="0.5"
      color="#222222">
    </a-cylinder>

    <a-cone
      position="-3.4 1.45 -6.5"
      radius-bottom="0.25"
      radius-top="0.12"
      height="0.4"
      color="#f5deb3">
    </a-cone>

    <!-- DESK -->

    <a-box
      position="2.1 1 -6.2"
      width="2"
      height="0.12"
      depth="1"
      color="#4b2e22"
      shadow="cast: true">
    </a-box>

    <!-- DESK LEGS -->

    <a-box position="1.25 0.5 -5.8" width="0.1" height="1" depth="0.1" color="#222"></a-box>

    <a-box position="2.95 0.5 -5.8" width="0.1" height="1" depth="0.1" color="#222"></a-box>

    <a-box position="1.25 0.5 -6.6" width="0.1" height="1" depth="0.1" color="#222"></a-box>

    <a-box position="2.95 0.5 -6.6" width="0.1" height="1" depth="0.1" color="#222"></a-box>

    <!-- MONITOR -->

    <a-box
      position="2.1 1.45 -6.55"
      width="1.1"
      height="0.65"
      depth="0.08"
      color="#111111"
      shadow="cast: true">
    </a-box>

    <!-- SCREEN -->

    <a-box
      position="2.1 1.45 -6.5"
      width="0.95"
      height="0.5"
      depth="0.02"
      color="#4c88c7">
    </a-box>

    <!-- KEYBOARD -->

    <a-box
      position="2.1 1.08 -5.9"
      width="0.9"
      height="0.04"
      depth="0.25"
      color="#111111">
    </a-box>

    <!-- CHAIR -->

    <a-box
      position="2.1 0.55 -4.8"
      width="0.8"
      height="0.12"
      depth="0.8"
      color="#222222"
      shadow="cast: true">
    </a-box>

    <a-box
      position="2.1 1 -5.1"
      width="0.8"
      height="0.9"
      depth="0.1"
      color="#222222"
      shadow="cast: true">
    </a-box>

    <a-cylinder
      position="2.1 0.28 -4.8"
      radius="0.06"
      height="0.5"
      color="#222222">
    </a-cylinder>

    <!-- DRESSER -->

    <a-box
      position="3.2 0.8 -3"
      width="1.2"
      height="1.5"
      depth="0.8"
      color="#6b4635"
      shadow="cast: true">
    </a-box>

    <!-- WINDOW -->

    <a-box
      position="-3.95 2.2 -3.8"
      width="0.05"
      height="1.5"
      depth="1.8"
      color="#87ceeb">
    </a-box>

    <!-- POSTER -->

    <a-plane
      position="0.8 2.2 -7.94"
      width="1.3"
      height="1.8"
      color="#993333">
    </a-plane>

    <!-- RUG -->

    <a-plane
      position="0 0.05 -3.8"
      rotation="-90 0 0"
      width="3"
      height="2"
      color="#8b0000"
      shadow="receive: true">
    </a-plane>

    <!-- DOOR -->

    <a-box
      position="3.95 1.4 -6.3"
      width="0.08"
      height="2.8"
      depth="1.2"
      color="#5c3a28">
    </a-box>

    <!-- DOOR HANDLE -->

    <a-sphere
      position="3.87 1.35 -5.9"
      radius="0.06"
      color="#d4af37">
    </a-sphere>

    <!-- SKY -->

    <a-sky color="#20242b"></a-sky>

    <!-- CAMERA -->

    <a-entity position="0 1.6 1.5">

      <a-camera
        wasd-controls
        look-controls>
      </a-camera>

    </a-entity>

  </a-scene>

</body>

</html>
