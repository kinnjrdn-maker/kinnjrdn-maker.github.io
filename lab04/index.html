<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>A-Frame Bedroom</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <!-- A-FRAME EXTRAS FOR MOVEMENT CONTROLS -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <!-- BLINK CONTROLS FOR TELEPORTATION -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls/dist/aframe-blink-controls.min.js"></script>

  <!-- VISUAL INSPECTOR -->
  <script src="https://unpkg.com/aframe-inspector@1.7.0/dist/aframe-inspector.min.js"></script>
</head>

<body>

<a-scene shadow="type: pcfsoft">

  <!-- ASSETS -->
  <a-assets>
    <img id="woodTex" src="./finalproject/assets/texture/wood_table_001_diff_4k.jpg">
    <img id="wallTex" src="./assets/texture/brushgoldtexture.png">
  </a-assets>

  <!-- LIGHTS -->
  <a-light
    type="ambient"
    color="#ffffff"
    intensity="0.45">
  </a-light>

  <a-light
    type="directional"
    color="#ffffff"
    intensity="0.8"
    position="-4 6 3"
    castShadow="true"
    shadowMapWidth="1024"
    shadowMapHeight="1024">
  </a-light>

  <a-light
    type="point"
    color="#ffd6a0"
    intensity="2"
    distance="10"
    position="-3 2.5 -6">
  </a-light>

  <!-- SKY -->
  <a-sky color="#20242b"></a-sky>

  <!-- FLOOR FOR WALKING AND TELEPORTATION -->
  <a-plane
    class="floor"
    position="0 0 -3.090"
    rotation="-90 0 0"
    width="12"
    height="12"
    scale="1 0.490 1"
    material="src: #woodTex; repeat: 4 4; color: #6a4a2f; roughness: 1"
    shadow="receive: true">
  </a-plane>

  <!-- CEILING -->
  <a-plane
    position="0 4 0"
    rotation="90 0 0"
    width="12"
    height="12"
    color="#eeeeee">
  </a-plane>

  <!-- BACK WALL -->
  <a-box
    position="0 2 -6"
    width="12"
    height="4"
    depth="0.1"
    color="#d8d0c4">
  </a-box>

  <!-- LEFT WALL -->
  <a-box
    position="-6 2 -3.344"
    width="0.1"
    height="4"
    depth="12"
    scale="1 1 0.570"
    color="#cfc7bc">
  </a-box>

  <!-- RIGHT WALL -->
  <a-box
    position="6 2 -3.532"
    width="0.1"
    height="4"
    depth="12"
    scale="1 1 0.570"
    color="#cfc7bc">
  </a-box>

  <!-- BED FRAME -->
  <a-box
    material="src: #woodTex; roughness: 1"
    position="-3 0.3 -3.8"
    width="2.5"
    height="0.4"
    depth="3.5"
    color="#5b3a29"
    shadow="cast: true; receive: true">
  </a-box>

  <!-- MATTRESS -->
  <a-box
    position="-3 0.7 -3.8"
    width="2.35"
    height="0.35"
    depth="3.3"
    color="#e6e6e6"
    shadow="cast: true">
  </a-box>

  <!-- BLANKET -->
  <a-box
    position="-3 0.95 -3"
    width="2.2"
    height="0.12"
    depth="1.8"
    color="#355c8a"
    shadow="cast: true">
  </a-box>

  <!-- PILLOW -->
  <a-box
    position="-3 1 -5"
    width="1.5"
    height="0.2"
    depth="0.6"
    color="#ffffff"
    shadow="cast: true">
  </a-box>

  <!-- NIGHTSTAND -->
  <a-box
    position="-4.7 0.45 -4.8"
    width="0.8"
    height="0.9"
    depth="0.8"
    color="#4a2d20"
    shadow="cast: true">
  </a-box>

  <!-- LAMP BASE -->
  <a-cylinder
    position="-4.7 1.05 -4.8"
    radius="0.08"
    height="0.5"
    color="#222222"
    shadow="cast: true">
  </a-cylinder>

  <!-- LAMP SHADE -->
  <a-cone
    position="-4.7 1.45 -4.8"
    radius-bottom="0.3"
    radius-top="0.15"
    height="0.4"
    color="#f5deb3"
    shadow="cast: true">
  </a-cone>

  <!-- DESK TOP -->
  <a-box
    position="3 1 -4.7"
    width="2.2"
    height="0.15"
    depth="1"
    color="#4b2e22"
    shadow="cast: true">
  </a-box>

  <!-- DESK LEGS -->
  <a-box position="2.1 0.5 -4.3" width="0.12" height="1" depth="0.12" color="#222222"></a-box>
  <a-box position="3.9 0.5 -4.3" width="0.12" height="1" depth="0.12" color="#222222"></a-box>
  <a-box position="2.1 0.5 -5.1" width="0.12" height="1" depth="0.12" color="#222222"></a-box>
  <a-box position="3.9 0.5 -5.1" width="0.12" height="1" depth="0.12" color="#222222"></a-box>

  <!-- COMPUTER MONITOR -->
  <a-box
    position="3 1.45 -5.15"
    width="1.2"
    height="0.7"
    depth="0.08"
    color="#111111"
    shadow="cast: true">
  </a-box>

  <!-- SCREEN -->
  <a-box
    position="3 1.45 -5.1"
    width="1"
    height="0.5"
    depth="0.02"
    color="#4c88c7">
  </a-box>

  <!-- KEYBOARD -->
  <a-box
    position="3 1.1 -4.45"
    width="1"
    height="0.04"
    depth="0.3"
    color="#111111">
  </a-box>

  <!-- CHAIR SEAT -->
  <a-box
    position="3 0.55 -3.3"
    width="0.9"
    height="0.15"
    depth="0.9"
    color="#222222"
    shadow="cast: true">
  </a-box>

  <!-- CHAIR BACK -->
  <a-box
    position="3 1.05 -3.65"
    width="0.9"
    height="1"
    depth="0.15"
    color="#222222"
    shadow="cast: true">
  </a-box>

  <!-- CHAIR POST -->
  <a-cylinder
    position="3 0.3 -3.3"
    radius="0.07"
    height="0.6"
    color="#222222">
  </a-cylinder>

  <!-- DRESSER -->
<a-box
  position="2.3 0.8 -1"
  width="1.3"
  height="1.5"
  depth="0.8"
  color="#6b4635"
  shadow="cast: true">
</a-box>

<!-- DRESSER DRAWER LINES -->
<a-box
  position="2.3 1.15 -1.38"
  width="1.1"
  height="0.06"
  depth="0.04"
  color="#222222">
</a-box>

<a-box
  position="2.3 0.8 -1.38"
  width="1.1"
  height="0.06"
  depth="0.04"
  color="#222222">
</a-box>

<a-box
  position="2.3 0.45 -1.38"
  width="1.1"
  height="0.06"
  depth="0.04"
  color="#222222">
</a-box> 
  <!-- WINDOW -->
  <a-box
    position="-5.95 2.3 -1.5"
    width="0.05"
    height="1.5"
    depth="1.8"
    color="#87ceeb">
  </a-box>



  <!-- POSTER -->
  <a-plane
    position="0.5 2.3 -5.94"
    width="1.4"
    height="2"
    color="#993333">
  </a-plane>

  <!-- RUG -->
  <a-plane
    position="0 0.03 -2.2"
    rotation="-90 0 0"
    width="3.5"
    height="2.2"
    color="#8b0000"
    shadow="receive: true">
  </a-plane>

  <!-- DOOR -->
  <a-box
    position="5.95 1.4 -4"
    width="0.08"
    height="2.8"
    depth="1.3"
    color="#5c3a28">
  </a-box>

  <!-- DOOR HANDLE -->
  <a-sphere
    position="5.86 1.35 -3.6"
    radius="0.07"
    color="#d4af37">
  </a-sphere>

  <!-- PLAYER: MOBILE FORWARD MOVEMENT + TELEPORTATION -->
  <a-entity
    id="player"
    movement-controls="controls: keyboard, touch; speed: 0.3"
    position="0 0 3">

    <!-- CAMERA -->
    <a-entity
      id="camera"
      camera
      look-controls
      position="0 1.6 0">
    </a-entity>

    <!-- LEFT HAND TELEPORT -->
    <a-entity
      id="left-hand"
      raycaster="objects: .floor"
      oculus-touch-controls="hand: left"
      blink-controls>
    </a-entity>

    <!-- RIGHT HAND TELEPORT -->
    <a-entity
      id="right-hand"
      raycaster="objects: .floor"
      oculus-touch-controls="hand: right"
      blink-controls>
    </a-entity>

  </a-entity>

</a-scene>

</body>
</html>
