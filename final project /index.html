<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Celestial Noir</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>

      <!-- BACKGROUND -->
      <a-sky color="#0a0f0a"></a-sky>

      <!-- FLOOR -->
      <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="12" height="12"
        color="#1a1f1a">
      </a-plane>

      <!-- CEILING -->
      <a-plane
        position="0 4 0"
        rotation="90 0 0"
        width="12" height="12"
        color="#0d120d">
      </a-plane>

      <!-- WALLS -->
      <!-- Back wall (you face this when you enter) -->
      <a-box position="0 2 -6"   width="12" height="4" depth="0.1" color="#1c2b1c"></a-box>
      <!-- Front wall (behind camera) -->
      <a-box position="0 2 6"    width="12" height="4" depth="0.1" color="#1c2b1c"></a-box>
      <!-- Left wall -->
      <a-box position="-6 2 0"   width="0.1" height="4" depth="12" color="#1c2b1c"></a-box>
      <!-- Right wall -->
      <a-box position="6 2 0"    width="0.1" height="4" depth="12" color="#1c2b1c"></a-box>

      <!-- BRAND SIGNAGE on back wall -->
      <!-- Swap src with your actual logo/text image from A4 -->
      <a-plane
        position="0 2.5 -5.8"
        width="3" height="1"
        color="#2d4a2d">
      </a-plane>

      <!-- DISPLAY PEDESTALS (3 in a row) -->
      <!-- Left pedestal -->
      <a-box position="-3 0.6 -2" width="0.8" height="1.2" depth="0.8" color="#2a3a2a"></a-box>
      <!-- Center pedestal -->
      <a-box position="0 0.6 -2"  width="0.8" height="1.2" depth="0.8" color="#2a3a2a"></a-box>
      <!-- Right pedestal -->
      <a-box position="3 0.6 -2"  width="0.8" height="1.2" depth="0.8" color="#2a3a2a"></a-box>

      <!-- CLOTHING RACK (simple version using primitives) -->
      <!-- Horizontal bar -->
      <a-cylinder position="-4.5 2 0" radius="0.03" height="2" rotation="0 0 90" color="#c9a84c"></a-cylinder>
      <!-- Left post -->
      <a-cylinder position="-5.5 1 0" radius="0.03" height="2" color="#c9a84c"></a-cylinder>
      <!-- Right post -->
      <a-cylinder position="-3.5 1 0" radius="0.03" height="2" color="#c9a84c"></a-cylinder>

      <!-- WALL PANELS (decorative, left and right walls) -->
      <a-plane position="-5.8 2 -2" rotation="0 90 0" width="3" height="2.5" color="#243324"></a-plane>
      <a-plane position="-5.8 2 2"  rotation="0 90 0" width="3" height="2.5" color="#243324"></a-plane>
      <a-plane position="5.8 2 -2"  rotation="0 -90 0" width="3" height="2.5" color="#243324"></a-plane>
      <a-plane position="5.8 2 2"   rotation="0 -90 0" width="3" height="2.5" color="#243324"></a-plane>

      <!-- CAMERA — user starts near entrance, looks toward back wall -->
      <a-entity position="0 1.6 4">
        <a-camera look-controls wasd-controls></a-camera>
      </a-entity>

    </a-scene>
  </body>
</html>
