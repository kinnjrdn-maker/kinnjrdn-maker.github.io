<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
 <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
<body>
    <a-scene background="color: #FAFAFA">

       <a-box color="#fff" position="0 0 -5"></a-box>
       <a-sky color="#aaa"></a-sky>
       <a-box color="red" width="3"></a-box>



       <!-- Floor -->
            <a-plane
                rotation="-0 0 90"
                position="12 0 0 "
                width="10"
                height="10"
                color="#333">
            </a-plane>

            <!-- Triangle -->
            <a-triangle
                position="-13 1 -4"
                rotation="-90 0 0"
                vertex-a="0 1 0"
                vertex-b="-1 -1 0"
                vertex-c="1 -1 0"
                color="#EF2D5E">
            </a-triangle>

            <!-- Circle -->
            <a-circle
                position="-10 1 -4"
                rotation="-90 0 0"
                radius="0.8"
                color="#FFC65D">
            </a-circle>

            <!-- Ring -->
            <a-ring
                position="-7 1 -4"
                rotation="-90 0 0"
                radius-inner="0.5"
                radius-outer="1"
                color="#4CC3D9">
            </a-ring>

            <!-- Box -->
            <a-box
                position="-3 1 -4"
                depth="1"
                height="1"
                width="1"
                color="#4CC3D9">
            </a-box>

            <!-- Sphere -->
            <a-sphere
                position="2 1 -4"
                radius="0.5"
                color="#EF2D5E">
            </a-sphere>

            <!-- Cylinder -->
            <a-cylinder
                position="0 1 -4"
                radius="0.3"
                height="1.5"
                color="#FFC65D">
            </a-cylinder>

            <!-- Cone -->
            <a-cone
                position="5 1 -4"
                radius-bottom="0.5"
                height="1.5"
                color="#AA66CC">
            </a-cone>
                
            <!-- Torus -->
            <a-torus
                position="-6 1 -4"
                radius="0.8"
                radius-tubular="0.15"
                color="#4CC3D9">
            </a-torus>

            <!-- Torus Knot -->
            <a-torus-knot
                position="-3 1 -4"
                radius="0.6"
                radius-tubular="0.12"
                color="#EF2D5E"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
            </a-torus-knot>

            <!-- Dodecahedron -->
            <a-dodecahedron
                position="0 1 -4"
                radius="0.8"
                color="#FFC65D"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
            </a-dodecahedron>

            <!-- Octahedron -->
            <a-octahedron
                position="3 1 -4"
                radius="0.8"
                color="#7BC8A4"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
            </a-octahedron>

            <a-tetrahedron
                position="11 1 -4"
                radius="0.8"
                color="#7BC8A4"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
            </a-tetrahedron>

            <!-- Icosahedron -->
            <a-icosahedron
                position="6 1 -4"
                radius="0.8"
                color="#AA66CC"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
            </a-icosahedron>
    </a-scene>
    
</body>
</html>
