<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Celestial Noir</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>

      <!-- LIGHTS -->
      <a-light type="ambient" color="#ffffff" intensity="0.5"></a-light>
      <a-light type="point" position="0 3.5 0" color="#f5c842" intensity="80" distance="100"></a-light>

      <!-- ASSETS -->
       <a-assets>
        <img id="goldTex" src="./assets/texture/brushgoldtexture.png">
        <img id="floortex" src="./assets/texture/wood_table_001_diff_4k.jpg">
        <a-asset-item id="chandelier" src="./assets/objects/chandelier.glb"></a-asset-item>
        <a-asset-item id="bookshelf" src="./assets/objects/Bookshelfgood.glb"></a-asset-item>
        <img id="img1" src="./assets/images/Bmark.jpg">
        <img id="img2" src="./assets/images/Wmark.png">
        <a-asset-item id="text" src="./assets/objects/cntext.glb"></a-asset-item>
        <a-asset-item id="shelve" src="./assets/objects/shelve.glb"></a-asset-item>
        <a-asset-item id="Gate" src="./assets/objects/victorian_gate.glb"></a-asset-item>
        <a-asset-item id="Desk" src="./assets/objects/game_ready_victorian_style_writing_desk.glb"></a-asset-item>
        <a-asset-item id="Chair" src="./assets/objects/victorian_desk_chair.glb"></a-asset-item>
      </a-assets>

      <!-- SKY -->
      <a-sky color="87CEEB"></a-sky>

      <!-- FLOOR -->
      <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="12" height="12"
        scale ="0.510 1 1"
        material="src: #floortex; repeat: 4 4; color: #6a4a2f; metalness: -1; roughness: 8">
      </a-plane>

      <!-- CEILING -->
      <a-plane
        position="0 4 0"
        rotation="90 0 0"
        width="12" height="12"
        scale ="0.510 1 1"
        color="#0d120d">
      </a-plane>

       <!-- front desk -->
      <a-entity
      gltf-model="#Desk"
      position="0 0 -3,771"
      rotation="0 180,.00 0"
      scale="1.530 1 1">
      </a-entity> 

      <!-- front desk chair -->
      <a-entity
      gltf-model="#Chair"
      position="0 0 -5"
      rotation="0 180 0"
      scale="1 1 1">
      </a-entity> 

      <!-- front fence -->
      <a-entity
      gltf-model="#Gate"
      position="-3.033 0.536 9.020"
      rotation="0 90 0"
      scale="0.005 0.005 0.005">
      </a-entity> 

      <a-entity
      gltf-model="#Gate"
      position="3.037 0.536 9.126"
      rotation="0 180.00 0"
      scale="0.005 0.005 0.005">
      </a-entity> > 

     <a-entity
      gltf-model="#Gate"
      position="3.037 0.536 9.120"
      rotation="0 180.0 0"
      scale="0.005 0.005 0.005">
      </a-entity> 

      <!-- LOGO Fence SIGN -->
      <a-entity gltf-model="#text"
          position="1.643 0.577 9.194"
          rotation="0 -32.680 0"
          scale="0.030 0.030 0.030">
      </a-entity>

      <!-- BACK WALL -->
      <a-box position="0 2 -6.029" scale="0.520 1.070 1" width="12" height="4" depth="0.1" color="#1c2b1c"></a-box>
      <a-plane position="0 2 -5.973" width="12" height="4" scale="0.520 1.070 1"
        material="src: #goldTex; metalness: 1; roughness: 0.15; transparent: true; side: double">
      </a-plane>

      <!-- shelf -->
       <a-entity
          gltf-model="#shelve"
          position="-0.157 -0.865 -5.928"
          rotation="0 60030.140 0"
          scale="1.400 1.400 2.900"
          rotation="0 0 0">
      </a-entity>

      

      <!-- FRONT WALL -->
      <a-entity
  gltf-model="#shopfront"
  position="-4.404 -0.000 6.066"
  rotation="0 0 0"
  scale="1.140 1.360 0.530">
</a-entity>

      <!-- LEFT WALL -->
      <a-box position="-3.118 2 0" width="0.1" height="4" depth="12" color="#1c2b1c"></a-box>
      <a-plane position="-3.06 2 0" rotation="0 90 0" width="12" height="4"
        material="src: #goldTex; metalness: 1; roughness: 0.15; transparent: true; side: double">
      </a-plane>

      <!-- RIGHT WALL -->
      <a-box position="3.107 2 0" width="0.1" height="4" depth="12" color="#1c2b1c"></a-box>
      <a-plane position="3.055 2 0" rotation="0 -90 0" width="12" height="4"
        material="src: #goldTex; metalness: 1; roughness: 0.15; transparent: true; side: double">
      </a-plane>

      <!-- LOGO SIGN -->
      <a-entity gltf-model="#text"
          position="0 2.5 -5.982"
          rotation="0 -45.180 0"
          scale="0.040 0.040 0.040">
      </a-entity>

      <!-- PEDESTAL -->
      
      <!-- CHANDELIER -->
     <a-entity
        gltf-model="#chandelier"
        position="0 2.806 0.741 3.178"
        scale="0.500 0.500 0.500"
        rotation="0 0 0">
      </a-entity>
        <!-- BOOKSHELF -->
      <a-entity
          gltf-model="#bookshelf"
          position="-0.434 0.020 9.288 "
          scale="4.860 1.480 1.500"
          rotation="0 6030.890 0"
          color="#b8b8b8"
          roughness="1"
          texture= "#floortex">

      </a-entity>

      <a-entity
          gltf-model="#bookshelf"
          position="-5.646 0.020 9.288"
          scale="4.860 1.480 1.500"
          rotation="0 6030.890 0"
          color="#b8b8b8"
          roughness="1"
          texture= "#floortex">

      </a-entity>

      <a-entity
          gltf-model="#bookshelf"
          position="2.669 0.020 -2.709 "
          rotation="0 6030.890 0"
          color="#b8b8b8"
          roughness="1"
          texture= "#floortex">

      </a-entity>

      <a-entity
          gltf-model="#bookshelf"
          position="2.669 0.020 3.179"
          rotation="0 6030.890 0"
          color="#b8b8b8"
          roughness="1"
          texture= "#floortex">

      </a-entity>

      <!-- WALL PANELS / ADS -->
      <a-plane position="3.044 2.500 0.248"
         rotation="0 -90 0"
         width="1.360"
         height="2.5"
         material="src: #img2; side: double"
          color:="#b8b8b8"
          roughness="1"
         ></a-plane>
      
      <a-plane position="-3.022 2.500 0.248"
         rotation="0 90.010 0"
         width="1.360" height="2.5"
         material="src: #img1"
         color:="#b8b8b8"
         roughness="1"
         ></a-plane>
         
     

      <!-- CAMERA -->
      <a-entity position="0 .5 0">
        <a-camera look-controls wasd-controls></a-camera>
      </a-entity>

    </a-scene>
  </body>
</html>
