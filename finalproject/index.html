<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Celestial Noir</title>
     <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  
  <body>
    <a-scene>

      
      <a-sky color="#0a0f0a"></a-sky>

      
      <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="12" height="12"
        color="#1a1f1a">
      </a-plane>

      
      <a-plane
        position="0 4 0"
        rotation="90 0 0"
        width="12" height="12"
        color="#0d120d">
      </a-plane>

      <!-- WALLS -->
      
      <a-box position="0 2 -6"   width="12" height="4" depth="0.1" color="#1c2b1c"></a-box>
      <!-- Front wall (behind camera) -->
      <a-box position="0 2 6"    width="12" height="4" depth="0.1" color="#1c2b1c"></a-box>
      <!-- Left wall -->
      <a-box position="-6 2 0"   width="0.1" height="4" depth="12" color="#1c2b1c"></a-box>
      <!-- Right wall -->
      <a-box position="6 2 0"    width="0.1" height="4" depth="12" color="#1c2b1c"></a-box>
      
      <!-- Logo sign-->
      <a-plane
        position="0 2.5 -5.8"
        width="3" height="1"
        color="#2d4a2d">
      </a-plane>

      <!-- center peniusula-->
      pedestal -->
      <a-box position="-3 0.6 -2" width="3.5" height="1.2" depth="0.8" color="#2a3a2a" rotation="0 90 0" depth="1.250"></a-box>
 
     

      
      <!-- advertisments -->
      <a-plane position="-5.8 2 -2" rotation="0 90 0" width="3" height="2.5" color="#243324"></a-plane>
      <a-plane position="-5.8 2 2"  rotation="0 90 0" width="3" height="2.5" color="#243324"></a-plane>
      <a-plane position="5.8 2 -2"  rotation="0 -90 0" width="3" height="2.5" color="#243324"></a-plane>
      <a-plane position="5.8 2 2"   rotation="0 -90 0" width="3" height="2.5" color="#243324"></a-plane>

      <!-- start -->
      <a-scene>
  <a-scene>
  <a-entity id="player" position="0 1.6 0" wasd-controls="acceleration: 30">
    <a-camera look-controls="pointerLockEnabled: true"></a-camera>
  </a-entity>
</a-scene>

      <!-- Height -->
   
  </body>
</html>
